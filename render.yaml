# Render Blueprint: one web service runs the API and serves the built website (frontend/dist is committed).
# Private inputs are NOT in the repo. Add two Secret Files in the Render dashboard (see docs/DEPLOY.md):
#   official.csv.xz.b64   and   validation.json
services:
  - type: web
    name: dengue-early-warning
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/private_data.py restore && uvicorn app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
